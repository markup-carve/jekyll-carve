name: Engine drift

# The development engine is the released carve-lang gem at an exact version
# (see Gemfile). A pin makes drift deliberate, but nothing notices when the pin
# has fallen behind, and a push-only CI reports the state of the day someone
# last touched the repo.
#
# The `drift` job compares the pinned version with the newest carve-lang on
# RubyGems. The `suite` job runs the real suite against the pin, so a
# transitive gem changing under it shows up. The `consumer` job installs the
# built gem and lets RubyGems resolve carve-lang through the gemspec range,
# which is what a user of this gem gets.
#
# Lag is reported, not gated: the engine moving is not a defect here. A pin
# that names no released version fails, because that build is already broken.

on:
  schedule:
    # 05:00 UTC daily, after the engine repos have had a night to settle.
    - cron: "0 5 * * *"
  workflow_dispatch:

# Jobs carry an explicit timeout-minutes: without one GitHub applies a
# 360-minute default, long enough for a stalled job to go unnoticed.

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Compare the pinned version against RubyGems
        run: |
          set -euo pipefail
          pinned="$(sed -n 's/^ *gem "carve-lang", "=\{0,1\} *\([0-9][0-9.]*\)".*/\1/p' Gemfile | head -1)"
          if [ -z "${pinned}" ]; then
            echo "::error::no exact carve-lang version found in Gemfile; the engine dependency is not pinned"
            exit 1
          fi
          versions="$(curl -fsS --retry 3 https://rubygems.org/api/v1/versions/carve-lang.json)"
          if ! printf '%s' "${versions}" | jq -e --arg v "${pinned}" 'any(.[]; .number == $v)' > /dev/null; then
            echo "::error::Gemfile pins carve-lang ${pinned}, which RubyGems does not serve"
            exit 1
          fi
          latest="$(curl -fsS --retry 3 https://rubygems.org/api/v1/versions/carve-lang/latest.json | jq -r .version)"
          echo "pinned engine: carve-lang ${pinned}; newest on RubyGems: ${latest}"
          newest="$(printf '%s\n%s\n' "${pinned}" "${latest}" | sort -V | tail -1)"
          if [ "${newest}" != "${pinned}" ]; then
            echo "::warning::the pinned engine ${pinned} is behind carve-lang ${latest}"
          fi

  # The pin makes the ENGINE deterministic; everything else in the bundle still
  # floats, and this repo has no committed lockfile. A scheduled run of the real
  # suite is what catches a transitive gem changing under it.
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install libclang (rb-sys bindgen)
        # BOUNDED AND RETRIED. Bare `apt-get` has no timeout, so a wedged
        # mirror hangs the job until the 6h runner limit - it produces no
        # output, which makes it indistinguishable from a slow compile. On
        # 2026-08-19 this step hung nine times across the two repositories that
        # install libclang, for 28 to 113 minutes each, and every one was
        # cleared only by cancelling and re-running.
        #
        # Three tries, each capped at 4 minutes. A hung mirror now costs 12
        # minutes worst case and says so, instead of an hour of silence.
        run: |
          for attempt in 1 2 3; do
            if timeout 240 sudo apt-get update && timeout 240 sudo apt-get install -y libclang-dev; then
              exit 0
            fi
            echo "::warning::apt attempt ${attempt} failed or timed out; retrying"
            sleep 10
          done
          echo "::error::apt-get could not install libclang-dev after 3 attempts"
          exit 1
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Verify the engine this run measures
        run: bundle exec ruby script/verify_engine_pin.rb
      - name: Run tests
        run: bundle exec rspec

  # WHAT A CONSUMER GETS, WHICH NO OTHER ROUTINE RUN HERE ASKS.
  #
  # Every job above measures the version `Gemfile` pins, so the gemspec range -
  # the only thing a user of this gem resolves through - is exercised nowhere
  # between releases. That is the cost of pinning: no pinned run ever
  # meets a carve-lang published after the pin, so an engine release that broke
  # rendering would sit unnoticed until someone raised the pin by hand. Which is
  # the same silence the pin was added to end, pointing the other way.
  #
  # So this job installs the built gem into an isolated GEM_HOME and lets
  # RubyGems resolve carve-lang through the declared range, exactly as
  # `release.yml` does before publishing - the difference being that this one
  # runs daily rather than on a tag, in a run nobody's pull request is waiting
  # on.
  consumer:
    name: The engine a consumer resolves
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install libclang (rb-sys bindgen)
        # BOUNDED AND RETRIED, for the reason spelled out in the job above.
        run: |
          for attempt in 1 2 3; do
            if timeout 240 sudo apt-get update && timeout 240 sudo apt-get install -y libclang-dev; then
              exit 0
            fi
            echo "::warning::apt attempt ${attempt} failed or timed out; retrying"
            sleep 10
          done
          echo "::error::apt-get could not install libclang-dev after 3 attempts"
          exit 1
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Build the gem
        run: gem build jekyll-carve.gemspec

      # No bundler and no Gemfile: this must resolve the way `gem install
      # jekyll-carve` does for a stranger, which means through the gemspec range
      # and nothing else.
      #
      # GEM_PATH AS WELL AS GEM_HOME. GEM_HOME alone only redirects where a gem
      # is WRITTEN; RubyGems keeps its default directories in `Gem.path`, so a
      # carve-lang already present on the runner stays visible and the probe
      # below can activate one this step never installed. The gemspec range is
      # not a backstop against that: a stray gem INSIDE `>= 0.1.1, < 0.2.0`
      # satisfies every claim the probe checked. Measured end to end with a
      # decoy carve-lang 0.1.1 outside the isolated prefix: with GEM_HOME alone
      # `gem install` treated the dependency as already satisfied, installed no
      # engine at all, and the probe activated the decoy.
      #
      # GEM_PATH is the isolated prefix ALONE, with no default directory on it.
      # markup-carve/carve-hexapdf#27 appended `Gem.default_dir` on the grounds
      # that Ruby's own default gems need it; measured here, they do not.
      # Default gems are found through `Gem.default_specifications_dir`
      # (`/usr/lib/ruby/gems/<abi>/specifications/default` on this host), which
      # is derived from neither `Gem.path` nor `Gem.default_dir` - `require
      # "json"`, `"openssl"` and `"psych"` all still activate with `Gem.path`
      # holding only the prefix below. Leaving the default directory on the
      # path would have kept open the single most likely home for a stray
      # engine, which is where an unqualified `gem install` on a runner puts
      # one.
      - name: Install it the way a consumer would
        run: |
          export GEM_HOME="${RUNNER_TEMP}/consumer"
          export GEM_PATH="${GEM_HOME}"
          gem install --no-document ./jekyll-carve-*.gem
          {
            echo "GEM_HOME=${GEM_HOME}"
            echo "GEM_PATH=${GEM_PATH}"
          } >> "$GITHUB_ENV"

      - name: Render the probe the floor was set for
        run: ruby script/consumer_engine_probe.rb
