name: CI

on:
  push:
    branches: [main]
  pull_request:

# Jobs carry an explicit timeout-minutes: without one GitHub applies a
# 360-minute default, long enough for a stalled job to go unnoticed.

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1", "3.2", "3.3"]

    steps:
      - uses: actions/checkout@v4

      # No Rust toolchain or libclang: the pinned carve-lang ships a precompiled
      # gem for this platform on every Ruby in the matrix.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      # A PIN NOTHING VERIFIES IS NOT A PIN. `Gemfile` pins carve-lang to an
      # exact release; this fails unless the bundle resolved and loaded that
      # version from RubyGems.
      - name: Verify the engine this run measures
        run: bundle exec ruby script/verify_engine_pin.rb

      - name: Run tests
        run: bundle exec rspec
