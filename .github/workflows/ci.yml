name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1", "3.2", "3.3"]

    steps:
      - uses: actions/checkout@v4

      # carve-lang builds a Rust native extension at install time.
      - uses: dtolnay/rust-toolchain@stable

      - name: Install libclang (rb-sys bindgen)
        # BOUNDED AND RETRIED. Bare `apt-get` has no timeout, so a wedged
        # mirror hangs the job until the 6h runner limit - it produces no
        # output, which makes it indistinguishable from a slow compile. On
        # 2026-08-19 this step hung nine times across the two repositories that
        # install libclang, for 28 to 113 minutes each, and every one was
        # cleared only by cancelling and re-running.
        #
        # Three tries, each capped at 4 minutes. A hung mirror now costs 12
        # minutes worst case and says so, instead of an hour of silence.
        run: |
          for attempt in 1 2 3; do
            if timeout 240 sudo apt-get update && timeout 240 sudo apt-get install -y libclang-dev; then
              exit 0
            fi
            echo "::warning::apt attempt ${attempt} failed or timed out; retrying"
            sleep 10
          done
          echo "::error::apt-get could not install libclang-dev after 3 attempts"
          exit 1

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      # A PIN NOTHING VERIFIES IS NOT A PIN. `Gemfile` pins carve-lang to a
      # carve-rb revision, but until now nothing read it back, so every way of
      # measuring a different engine left the run below green and silent: the
      # ref dropped, `CARVE_RB_PATH` set in the environment, or a restored
      # bundler cache resolved before the pin last moved. This states the engine
      # behind the result and fails when it is not the pinned one.
      - name: Verify the engine this run measures
        run: bundle exec ruby script/verify_engine_pin.rb

      - name: Run tests
        run: bundle exec rspec
