# This gem has never been published. v0.1.0 was prepared and deliberately held,
# because `carve-lang >= 0.1.0` let a consumer resolve an engine that predates
# the Carve 0.1.3 security release - so the plugin's own suite could be green
# while every install of it rendered a list-valued URL attribute unsanitized.
# carve-lang 0.1.1 fixed that, the floor moved with it, and this is the missing
# half: something that can actually publish.
#
# PUBLISH SITS BEHIND THE GATE VIA `needs:`, not step order. A check placed in
# front of a push step in the same job goes green when it is skipped, which is
# how markup-carve/carve-py half-shipped: tag and release live, upload skipped,
# registry still serving the version the security fix was for.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  # A tag-triggered workflow is unexercisable between releases, which is how a
  # release job rots. A dispatch runs the whole gate against main and stops
  # before publishing.
  workflow_dispatch:

jobs:
  verify:
    name: Build the gem and prove the engine under it is patched
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: The tag, the version constant and the changelog agree
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="$(sed -n 's/.*VERSION[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' lib/jekyll/carve/version.rb | head -1)"
            echo "rehearsal: no tag exists, using VERSION ($tag)"
          else
            tag="${GITHUB_REF_NAME#v}"
          fi
          ver="$(sed -n 's/.*VERSION[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' lib/jekyll/carve/version.rb | head -1)"
          [ "$tag" = "$ver" ] \
            || { echo "::error::Jekyll::Carve::VERSION is $ver, tag is $tag"; exit 1; }
          grep -qE "^## \[?${tag}\]? - " CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no section for $tag"; exit 1; }
          echo "version $ver"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Install libclang, which rb-sys needs to build carve-lang
        # BOUNDED AND RETRIED. Bare `apt-get` has no timeout, so a wedged
        # mirror hangs the job until the 6h runner limit - it produces no
        # output, which makes it indistinguishable from a slow compile. On
        # 2026-08-19 this step hung nine times across the two repositories that
        # install libclang, for 28 to 113 minutes each, and every one was
        # cleared only by cancelling and re-running.
        #
        # Three tries, each capped at 4 minutes. A hung mirror now costs 12
        # minutes worst case and says so, instead of an hour of silence.
        run: |
          for attempt in 1 2 3; do
            if timeout 240 sudo apt-get update && timeout 240 sudo apt-get install -y libclang-dev; then
              exit 0
            fi
            echo "::warning::apt attempt ${attempt} failed or timed out; retrying"
            sleep 10
          done
          echo "::error::apt-get could not install libclang-dev after 3 attempts"
          exit 1

      - run: bundle exec rspec

      - name: Build gem
        run: gem build jekyll-carve.gemspec

      # `spec.files` is a Dir[] glob, so a rename ships a gem missing its own
      # code and nothing says so.
      - name: The gem carries the library
        run: |
          gem="$(ls jekyll-carve-*.gem)"
          listing="$(tar -xOf "$gem" data.tar.gz | tar -tzf -)"
          missing=0
          for want in lib/jekyll-carve.rb README.md LICENSE; do
            printf '%s\n' "$listing" | grep -qx "$want" \
              || { echo "::error::the gem is missing $want"; missing=1; }
          done
          n="$(printf '%s\n' "$listing" | grep -c '^lib/.*\.rb$')"
          [ "$n" -ge 2 ] || { echo "::error::only $n ruby file(s) under lib/"; missing=1; }
          exit $missing

      # THE GATE THIS REPOSITORY EXISTS TO HAVE. Install the built gem into an
      # isolated GEM_HOME, let RubyGems resolve `carve-lang` through the floor
      # the gemspec declares, and render the probe that the held release was
      # held for. A floor is a claim about what a consumer resolves; this is the
      # only way to check the claim rather than restate it.
      #
      # It runs against the INSTALLED gem, not the checkout: Gemfile pins an
      # engine by git ref for development, and a consumer gets whatever the
      # floor resolves. Those are different engines and this repository has
      # already been bitten by the difference.
      #
      # The probe itself lives in `script/consumer_engine_probe.rb` because the
      # daily `consumer` job in `.github/workflows/engine-drift.yml` has to ask
      # the identical question - this one before publishing, that one before a
      # user finds out - and two copies of a security check drift apart.
      - name: The engine a consumer resolves sanitizes a list-valued URL
        run: |
          gem="$(ls jekyll-carve-*.gem)"
          export GEM_HOME="${RUNNER_TEMP}/consumer"
          gem install --no-document "./${gem}"
          GEM_HOME="$GEM_HOME" ruby script/consumer_engine_probe.rb

      - uses: actions/upload-artifact@v4
        with:
          name: gem
          path: jekyll-carve-*.gem

  publish:
    name: Publish to RubyGems
    runs-on: ubuntu-latest
    needs: [verify]
    # OIDC TRUSTED PUBLISHING, not an API key. GitHub mints a short-lived token
    # naming this repository and workflow, RubyGems exchanges it for a
    # credential valid for minutes, and the long-lived key leaves the
    # repository entirely - a leaked key can push any gem the account owns, and
    # there is now nothing to leak.
    #
    # Proven on carve-hexapdf first, which is where the sharp edge showed up: a
    # trusted publisher cannot claim a gem NAME that has never been published,
    # so that gem needed one manual first push before OIDC could take over.
    # jekyll-carve is already on RubyGems, so its publisher can claim it and the
    # first OIDC push is the next release.
    #
    # `id-token: write` is required and never granted implicitly.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gem

      # Skipped on a dispatch: a rehearsal must not mint a publishing
      # credential, and has nothing to authenticate.
      - name: Exchange the OIDC token for a RubyGems credential
        if: github.event_name != 'workflow_dispatch'
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      # Pushes the artifact the gate verified rather than building a second
      # copy, so what RubyGems serves is the bytes that rendered the probe.
      - name: Publish to RubyGems
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::notice::rehearsal - nothing was published to RubyGems"
            ls -l jekyll-carve-*.gem
          else
            gem push jekyll-carve-*.gem
          fi
