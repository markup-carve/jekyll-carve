title: Carve + Jekyll Example
description: Demonstrates the jekyll-carve converter.

plugins:
  - jekyll-carve

# Carve engine options consumed by Jekyll::Carve::Converter.
carve:
  extensions:
    - heading_permalinks
  # The `:name:` map. An inline mapping and a JSON file, merged left to right.
  # Read only from here and from files named here - a symbol value is emitted
  # RAW, so it must never come from anything a visitor can influence.
  symbols:
    - _data/symbols.json
    - carve: '<abbr title="the Carve markup language">Carve</abbr>'

# Keep the build minimal and deterministic.
exclude:
  - Gemfile
  - Gemfile.lock
